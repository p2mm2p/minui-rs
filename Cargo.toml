[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/render",
    "crates/minui",
    "crates/minarch",
    "crates/clock",
    "crates/minput",
    "platforms/tg5040",
    "platforms/tg5040/show",
    "platforms/tg5040/keymon",
    "platforms/tg5040/xtask",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# ── 内部 crate（path 依赖，相对根解析；成员写 workspace = true）────────────
common = { path = "crates/common" }
render = { path = "crates/render" }
platform-tg5040 = { path = "platforms/tg5040" }

# ── 第三方依赖（全项目清单；版本与 features 的唯一来源）─────────────────
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fontdue = "0.9.2"
libc = "0.2"
libloading = "0.8"
png = "0.17"
# unsafe_textures：去掉 Texture<'r> 生命周期参数，使 SDL 纹理可作为结构体字段
# （生命周期纠缠的替代方案是结构体带生命周期泛型，会传染所有使用处——更复杂）
sdl2 = { version = "0.36", features = ["unsafe_textures"] }
# 启用 sdl2-sys 的 use-pkgconfig：让 build 脚本通过 pkg-config 输出 -L 链接搜索路径
# （sdl2-sys 默认 features 为空，不启用则 macOS 上找不到 Homebrew 的 SDL2）
sdl2-sys = { version = "0.36", features = ["use-pkgconfig"] }
