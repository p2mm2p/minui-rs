[package]
name = "clock"
version.workspace = true
edition.workspace = true

[dependencies]
common = { path = "../common" }
render = { path = "../render" }
# libc：读取系统本地时间（localtime_r）——原版 clock.c 用 localtime()，
# Rust 标准库无本地时间函数，需 FFI。与平台 crate 相同的 libc 用法。
libc = "0.2"

# 平台依赖 key = 平台代码（package rename）——`--features tg5040/<device>`
# 透传语法依赖 dep key 匹配；平台代码约定
tg5040 = { package = "platform-tg5040", path = "../../platforms/tg5040", optional = true }

[features]
default = []
tg5040 = ["dep:tg5040"]
