[package]
name = "clock"
version.workspace = true
edition.workspace = true

[dependencies]
common = { workspace = true }
render = { workspace = true }
# libc：读取系统本地时间（localtime_r）——原版 clock.c 用 localtime()，
# Rust 标准库无本地时间函数，需 FFI。与平台 crate 相同的 libc 用法。
libc = { workspace = true }

platform-tg5040 = { workspace = true, optional = true }

[features]
default = []
platform-tg5040 = ["dep:platform-tg5040"]
