name: Feature 请求
description: 提出新功能或改进建议，帮助我们改进产品
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出功能请求！请尽量完整填写以下信息，方便我们评估和规划。

  - type: input
    id: summary
    attributes:
      label: 功能简述
      description: 用一句话概括你希望新增或改进的功能。
      placeholder: "例如：移植到更多平台（如 rg35xx）"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 背景与要解决的问题
      description: 这个功能为什么重要？它解决了什么痛点？
      placeholder: "例如：目前只支持 tg5040 平台，其他 MinUI 设备用户无法使用。"
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能如何工作？请描述期望的行为。
      placeholder: "例如：实现 rg35xx 平台适配层，支持按键、音频与电源管理。"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案或临时解决办法？
      placeholder: "例如：目前只能在游戏名称上添加备注以帮助记忆。"
    validations:
      required: false

  - type: dropdown
    id: feature_type
    attributes:
      label: 功能类型
      description: 这个请求主要属于哪一类？
      options:
        - 新功能
        - 增强现有功能
        - UI/UX 改进
        - 性能优化
        - 开发者体验
        - 其他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级建议
      description: 从你的角度看，这个功能有多重要？最终优先级由维护者评估。
      options:
        - 低 - 有更好，没有也能接受
        - 中 - 能明显提升体验
        - 高 - 严重影响使用，希望尽快支持
    validations:
      required: false

  - type: textarea
    id: use_case
    attributes:
      label: 使用场景 / 用户故事
      description: 请描述谁会在什么场景下使用这个功能。
      placeholder: "例如：作为 TrimUI Brick 用户，我希望……"
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 参考实现 / 设计稿 / 链接
      description: 可粘贴类似产品的实现、设计稿、讨论链接等。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 Issue，确认没有重复的功能请求
        - label: 我已说明该功能要解决的问题
        - label: 我愿意在必要时提供更多信息或参与讨论