name: Bug 报告
description: 报告一个 Bug，帮助我们定位并修复问题
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug 报告！请尽量完整填写以下信息，以便我们更快复现和修复问题。

  - type: input
    id: summary
    attributes:
      label: 问题简述
      description: 用一句话概括你遇到的问题。
      placeholder: "例如：真机启动游戏后黑屏并返回菜单"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供详细的步骤，便于我们稳定复现。
      placeholder: |
        1. 在真机上进入游戏列表 ...
        2. 启动某个游戏 ...
        3. 执行 ... 操作 ...
        4. 观察到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
      placeholder: "例如：保存成功并提示“已保存”"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如果有错误提示，请一并说明。
      placeholder: "例如：按钮无反应，控制台报错 ..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Commit
      description: 你使用的版本号、分支或 commit hash。
      placeholder: "例如：v1.2.3 或 main@abc1234"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      description: 问题主要出现在哪个环境？
      options:
        - 真机
        - 宿主开发环境（cargo xtask 直跑）
        - 其他
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 设备平台 / 系统版本
      description: 真机请填具体设备型号与平台名（如 TrimUI Smart Pro / tg5040、Anbernic RG35XX Plus / rg35xxplus），宿主请填操作系统（如 Ubuntu 22.04）。
      placeholder: "例如：TrimUI Smart Pro（tg5040）或 Ubuntu 22.04"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 错误信息
      description: 请粘贴相关日志、堆栈或控制台输出。真机日志位于 /.userdata/[platform]/logs/[TAG].txt。
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 录屏 / 补充信息
      description: 可拖拽上传截图，或粘贴链接。也可补充其他有助于排查的信息。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 检查清单
      options:
        - label: 我已搜索现有 Issue，确认没有重复
        - label: 我使用的是最新版本或较新的版本
        - label: 我已尝试在干净环境中复现该问题
        - label: 我愿意在必要时提供更多信息或协助测试修复